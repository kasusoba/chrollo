services:
  chrollo:
    build: .
    restart: unless-stopped
    ports:
      # OAuth2 callback server, bound to this machine only. Reach it from other
      # devices through a reverse proxy (e.g. Tailscale serve) or an SSH tunnel.
      # Set PORT in .env (defaults to 3000).
      - "127.0.0.1:${PORT:-3000}:${PORT:-3000}"
    env_file:
      - .env
    volumes:
      # Persists Google OAuth tokens across restarts.
      # Run `touch tokens.json` first if the file doesn't exist yet.
      - ./tokens.json:/app/tokens.json
      # Persists album data
      - ./album.json:/app/album.json
      # Temp space for media while it is processed (files are deleted after upload).
      # Defaults to ./tmp. Set TMP_DIR in .env to use another disk, e.g. /mnt/hdd/chrollo-tmp
      - ${TMP_DIR:-./tmp}:/tmp
